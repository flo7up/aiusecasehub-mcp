name: Verify MCP adapter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily check that the hosted endpoint and new npm advisories haven't broken the adapter.
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node examples/verify-stdio.mjs
      - run: docker build -t aiusecasehub-mcp:local .
      - run: node examples/verify-stdio.mjs --docker
